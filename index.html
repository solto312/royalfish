  <script>

        res_eyebrow:'Забронировать стол', res_heading:'Бронь за секунды через WhatsApp',

        res_error:'Пожалуйста, заполните все поля.', res_submit:'Забронировать через WhatsApp',
        res_note:'Откроется WhatsApp на +996 705 520 222 с вашими данными.',
        ig_eyebrow:'Следите за уловом', ig_para:'Свежие истории, ежедневный улов и моменты у реки — прямо из нашей ленты.', ig_btn:'Открыть в Instagram',
        foot_tag:'Свежая форель и живописная природа на реке Аламедин. Столик у реки для всей семьи.',
        foot_visit:'Посетить', foot_connect:'Связаться', foot_hours:'Пн · 12:00 – 23:00' + ' · Вт-Вск · 11:00 – 23:00 (кухня до 22:00)',
        wa_greeting:'Здравствуйте, Royal Fish! Хочу забронировать стол.', wa_name:'Имя', wa_date:'Дата', wa_time:'Время', wa_guests:'Гостей', wa_thanks:'Спасибо!',
      },
      en: {
        nav_about:'About', nav_menu:'Menu', nav_location:'Location', nav_reserve:'Reserve', nav_book:'Book a Table',
        hero_badge:'Alamedin River · Koy-Tash, Kyrgyzstan',
        hero_title:'Fresh Trout & Picturesque Nature at Royal Fish',
        hero_sub:'Fish caught straight from the mountain river, cooked before your eyes and served beside crystal waters — where every meal tastes of clean alpine air.',
        hero_view_menu:'View Menu', hero_book:'Book a Table',
        about_eyebrow:'Our Story', about_heading:'A riverside table like no other',
        about_para:'Nestled where the Alamedin river tumbles down from the Arashan peaks, Royal Fish brings the catch of the day from cold mountain water straight to your plate. Come for the trout, stay for the view.',
        about_c1_t:'Caught from the water', about_c1_d:'Live trout from our own pools — you pick it, we cook it. Freshness you can taste.',
        about_c2_t:'Riverside outdoor seating', about_c2_d:'Family tables set right by the current, shaded by pines with the sound of running water.',
        about_c3_t:"Children's playground", about_c3_d:'A safe, fun play area so little ones roam free while grown-ups savour the moment.',
        about_c4_t:'Clean mountain air', about_c4_d:'Escape the city — breathe crisp alpine air beside untouched nature.',
        menu_eyebrow:'The Menu', menu_heading:'Straight from river to table', menu_sub:'Browse our full menu — every dish and price.', menu_swipe:'← Swipe to view all pages →',
        loc_eyebrow:'Find Us', loc_heading:'Find us on the map',
        loc_addr_l:'Address', loc_addr_v:'1 Chyngysh Baatyr St, Koy-Tash, Kyrgyzstan',
        loc_hours_l:'Opening Hours', loc_hours_1:'Mon · 12:00 AM – 11:00 PM', loc_hours_2:'Tue–Sun · 11:00 AM – 11:00 PM · Kitchen until 10:00 PM',
        loc_phone_l:'Reservations', loc_wa:'Message us on WhatsApp', loc_2gis:'Open in 2GIS',
        res_eyebrow:'Book a Table', res_heading:'Reserve in seconds via WhatsApp',
        res_para:"Fill in the details — we'll open WhatsApp with your request pre-written. No accounts, no waiting.",
        res_name_l:'Your name', res_name_ph:'e.g. Aizada', res_date_l:'Date', res_time_l:'Time', res_guests_l:'Number of guests',

        ig_eyebrow:'Follow the catch', ig_para:'Latest stories, daily catches and riverside moments — straight from our feed.', ig_btn:'View on Instagram',

        foot_visit:'Visit', foot_connect:'Connect', foot_hours:'Mon 12:00 AM–11:00 PM · Tue–Sun 11:00 AM–11:00 PM (kitchen until 10:00 PM)',

      },
    };

    /* ================= STATE ================= */
    let lang = localStorage.getItem('rf_lang') || 'ru';
    const t = k => (T[lang][k] ?? k);

    /* ---------- APPLY STATIC TRANSLATIONS ---------- */
    function applyI18n() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
      document.getElementById('langLabel').textContent = lang === 'ru' ? 'EN' : 'RU';
    }

    /* ---------- MENU IMAGE GALLERY (PDF pages 2–26) ---------- */
    const MENU_FIRST_PAGE = 2, MENU_LAST_PAGE = 26;
    function renderMenuImages() {
      let html = '';
      for (let i = MENU_FIRST_PAGE; i <= MENU_LAST_PAGE; i++) {
        const n = String(i).padStart(2, '0');
        const src = `menu-images/page-${n}.jpg`;
        html += `<a href="${src}" target="_blank" rel="noopener"
             class="snap-center shrink-0 w-[82%] xs:w-[70%] sm:w-[46%] lg:w-[31%] rounded-2xl overflow-hidden shadow-card img-fallback cursor-zoom-in hover:scale-[1.015] transition-transform">
          <img src="${src}" alt="Royal Fish menu — page ${i}" loading="lazy" class="w-full h-auto block" />
        </a>`;
      }
      document.getElementById('menuScroller').innerHTML = html;
    }
    function initMenuScroll() {
      const s = document.getElementById('menuScroller');
      const step = () => Math.max(280, s.clientWidth * 0.85);
      document.getElementById('menuPrev').addEventListener('click', () => s.scrollBy({ left: -step(), behavior: 'smooth' }));
      document.getElementById('menuNext').addEventListener('click', () => s.scrollBy({ left:  step(), behavior: 'smooth' }));
    }

    /* ---------- WHATSAPP RESERVATION ---------- */
    function initReserve() {
      const form = document.getElementById('reserveForm');
      form.addEventListener('submit', e => {
        e.preventDefault();
        const name = document.getElementById('rName').value.trim();
        const date = document.getElementById('rDate').value;
        const time = document.getElementById('rTime').value;
        const guests = document.getElementById('rGuests').value;
        const err = document.getElementById('formError');
        if (!name || !date || !time || !guests) { err.classList.remove('hidden'); return; }
        err.classList.add('hidden');
        const msg =
          `${t('wa_greeting')}%0A` +
          `%0A👤 ${t('wa_name')}: ${encodeURIComponent(name)}` +
          `%0A📅 ${t('wa_date')}: ${encodeURIComponent(date)}` +
          `%0A🕐 ${t('wa_time')}: ${encodeURIComponent(time)}` +
          `%0A👥 ${t('wa_guests')}: ${encodeURIComponent(guests)}` +
          `%0A%0A${t('wa_thanks')}`;
        window.open(`https://wa.me/996705520222?text=${msg}`, '_blank');
      });
      document.getElementById('rDate').valueAsDate = new Date();
    }

    /* ---------- INSTAGRAM ---------- */
    function renderIG() {
      const imgs = [
        'assets/photos/1.jpg',
        'assets/photos/9.jpg',
        'assets/photos/2.jpg',
        'assets/photos/5.jpg',
        'assets/photos/4.jpg',
        'assets/photos/6.jpg',
        'assets/photos/7.jpg',
        'assets/photos/3.jpg',
      ];
      document.getElementById('igGrid').innerHTML = imgs.map(src => `
        <a href="https://www.instagram.com/royalfish_kg/" target="_blank" rel="noopener"
           class="group relative aspect-square rounded-2xl overflow-hidden img-fallback cursor-pointer">
          <img src="${src}" alt="Royal Fish" loading="lazy" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" onerror="this.style.display='none'" />
          <span class="absolute inset-0 grid place-items-center bg-brand-900/0 group-hover:bg-brand-900/50 transition">
            <svg class="w-7 h-7 text-white opacity-0 group-hover:opacity-100 transition" fill="currentColor" aria-hidden="true"><use href="#ig-icon"></use></svg>
          </span>
        </a>`).join('');
      lucide.createIcons();
    }

    /* ---------- REVEAL / NAV ---------- */
    function initReveal() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    /* ---------- LANGUAGE ---------- */
    function setLang(l) {
      lang = l; localStorage.setItem('rf_lang', l);
      applyI18n(); lucide.createIcons();
    }

    /* ---------- INIT ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year').textContent = new Date().getFullYear();
      applyI18n();
      renderMenuImages(); initMenuScroll();
      initReserve(); renderIG(); initReveal();
      document.getElementById('langToggle').addEventListener('click', () => setLang(lang==='ru'?'en':'ru'));

      // Mobile menu toggle
      const navToggle = document.getElementById('navToggle');
      const mobileMenu = document.getElementById('mobileMenu');
      const closeMenu = () => {
        mobileMenu.classList.add('hidden');
        navToggle.setAttribute('aria-expanded', 'false');
        navToggle.innerHTML = '<i data-lucide="menu" class="w-6 h-6"></i>';
        lucide.createIcons();
      };
      navToggle.addEventListener('click', () => {
        const open = mobileMenu.classList.toggle('hidden') === false;
        navToggle.setAttribute('aria-expanded', String(open));
        navToggle.innerHTML = `<i data-lucide="${open ? 'x' : 'menu'}" class="w-6 h-6"></i>`;
        lucide.createIcons();
      });
      mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

      lucide.createIcons();
    });
